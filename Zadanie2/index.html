<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://kit.fontawesome.com/3cc346f338.js" crossorigin="anonymous"></script>
    <title>Task 2 - Recipes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container mt-4 mb-5">

    <h1 class="mb-4">Task 2 - Recipes</h1>

    <div class="mb-3">
        <label class="form-label" for="nameFilter">Wpisz nazwę</label>
        <input type="text" class="form-control" id="nameFilter">
    </div>

    <div class="mb-3">
        <label class="form-label" for="cuisineSelect">Wybierz kuchnię:</label>
        <select class="form-select" id="cuisineSelect">
            <option value="">All</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label" for="difficultySelect">Wybierz trudność:</label>
        <select class="form-select" id="difficultySelect">
            <option value="">All</option>
        </select>
        <label class="form-label" for="">Czas przygotowania:</label>
        <input type="range" class="form-range slider" id="prepTimeRange" step="5">
        <div class="d-flex justify-content-between text-muted small">
            <span id="minTime"></span>
            <span id="maxTime"></span>
        </div>
    </div>

    <button class="btn btn-primary mb-4" id="seeFavButton">Favourite Recipes</button>
    <button class="btn btn-danger mb-4" id="resetButton">Reset</button>

    <h2 id="recipesCounter" class="fs-4 mb-3"></h2>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead>
            <tr>
                <th>Name</th>
                <th>Cuisine</th>
                <th>Difficulty</th>
                <th>Preparation time</th>
                <th>Rating</th>
                <th>Favourite</th>
            </tr>
            </thead>

            <tbody id="recipesTable">
            </tbody>
        </table>
    </div>

    <h2 class="mt-5 fs-4">Raw data from Recipes API</h2>
    <pre id="apiData" class="bg-light p-3 border rounded"></pre>

</div>

<script src="main.js"></script>

</body>
</html>
