<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Task 2 - Recipes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container mt-4">

    <h1>Task 2 - Recipes</h1>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Name</th>
            <th>Cuisine</th>
            <th>Difficulty</th>
            <th>Preparation time</th>
            <th>Rating</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>Classic Margherita Pizza</td>
            <td>Italian</td>
            <td>Easy</td>
            <td>20 min</td>
            <td>4.6</td>
        </tr>
        <tr>
            <td>Vegetarian Stir-Fry</td>
            <td>Asian</td>
            <td>Easy</td>
            <td>15 min</td>
            <td>4.7</td>
        </tr>
        </tbody>
    </table>

    <h2>Raw data from Recipes API</h2>

    <pre id="apiData"></pre>

</div>

<script>
    let recipes = [];

    fetch("https://dummyjson.com/recipes")
        .then(response => response.json())
        .then(data => {
            recipes = data.recipes;

            document.getElementById("apiData").textContent =
                JSON.stringify(recipes, null, 2);
        });
</script>

</body>
</html>
